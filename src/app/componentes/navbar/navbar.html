<nav class="navbar">
  <a class="marca" routerLink="/home">CineApp</a>

  <div class="links">
    <!-- routerLinkActive agrega la clase 'active' cuando la URL coincide con el link -->
    <a routerLink="/home" routerLinkActive="active">Home</a>

    <!-- auth.perfil() es un signal: cuando cambia (login/logout), esta parte se vuelve a dibujar -->
    @if (auth.perfil(); as perfil) {
      @if (auth.perfil()?.rol === 'admin') {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
      @if (auth.perfil()?.rol === 'empleado') {
        <a routerLink="/empleado" routerLinkActive="active">Empleado</a>
      }
      @if (auth.perfil()?.rol === 'cliente') {
        <a routerLink="/mis-compras" routerLinkActive="active">Mis compras</a>
        <a routerLink="/propuestas" routerLinkActive="active">Proponer película</a>
      }
      <!-- Se crea al loguearse y se destruye al salir: así abre y cierra su canal de Realtime -->
      <app-campanita [usuarioId]="perfil.id" />
      <span class="usuario">Hola, {{ auth.perfil()?.nombre }}</span>
      <button class="salir" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Ingresar</a>
      <a routerLink="/registro" routerLinkActive="active">Registrarse</a>
    }
  </div>
</nav>
