<!-- Marco del panel: menú a la izquierda y, a la derecha, la ruta hija que toque -->
<div class="panel">
  <aside class="menu card">
    <h2>Administración</h2>
    <nav>
      <!-- exact: si no, "Películas" también se marcaría activo en /admin/peliculas/nueva -->
      <a routerLink="/admin/peliculas" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Películas</a>
      <a routerLink="/admin/peliculas/nueva" routerLinkActive="activo">Nueva película</a>
    </nav>
  </aside>

  <div class="contenido">
    <router-outlet />
  </div>
</div>
